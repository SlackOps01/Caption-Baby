name: Desktop release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish, for example v0.1.1
        required: true
        default: v0.1.1
        type: string
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo install tauri-cli --version 2.12.6 --locked
      - name: Stage standalone backend
        run: |
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if (!$ffmpeg) { throw "Chocolatey FFmpeg payload not found." }
          $env:PATH = "$($ffmpeg.DirectoryName);$env:PATH"
          python scripts/stage_windows.py
      - name: Build Windows installer
        working-directory: src-tauri
        run: cargo tauri build --config tauri.windows-installer.conf.json --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Caption-Baby-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libgtk-3-dev patchelf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packagers and bundled media tools
        run: |
          cargo install tauri-cli --version 2.12.6 --locked
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller static-ffmpeg==3.0
      - name: Stage standalone backend
        run: python scripts/stage_portable.py
      - name: Build Linux packages
        working-directory: src-tauri
        run: cargo tauri build --config tauri.linux.conf.json --bundles appimage,deb -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Caption-Baby-Linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install packagers and bundled media tools
        run: |
          cargo install tauri-cli --version 2.12.6 --locked
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller static-ffmpeg==3.0
      - name: Stage standalone backend
        run: python scripts/stage_portable.py
      - name: Build macOS disk image
        working-directory: src-tauri
        run: cargo tauri build --config tauri.macos.conf.json --target ${{ matrix.rust_target }} --bundles dmg -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Caption-Baby-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Caption-Baby-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Caption Baby ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
