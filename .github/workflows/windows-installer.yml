name: Windows installer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo install tauri-cli --version 2.12.6 --locked
      - name: Stage standalone backend
        run: |
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if (!$ffmpeg) { throw "Chocolatey FFmpeg payload not found." }
          $env:PATH = "$($ffmpeg.DirectoryName);$env:PATH"
          python scripts/stage_windows.py
      - name: Build Windows installer
        working-directory: src-tauri
        run: cargo tauri build --config tauri.windows-installer.conf.json --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Caption-Baby-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


